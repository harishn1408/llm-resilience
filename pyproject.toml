[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-resilience"
version = "0.1.0"
description = "Async multi-provider LLM gateway resilience: stateful circuit breakers, sliding-window rate limiting, and structured fallbacks"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Harish Nair", email = "harishn1408@gmail.com" }
]
keywords = ["llm", "resilience", "circuit-breaker", "rate-limiter", "fastapi", "redis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
redis = ["redis>=5.0.0"]
test = [
    "pytest>=8.0.0",
    "anyio>=4.0.0",
]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
